name: ayocuci_admin_api

services:
  admin-api:
    image: ${API_IMAGE:-ghcr.io/ayocuci/ayocuci-api:main}
    container_name: ${CONTAINER_NAME:-AyoCuci-Admin-API}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - traefik-network
      - ayocuci-network
      - mysql-database
    volumes:
      # Menggunakan ./ memastikan file tersimpan di folder host saat ini
      - ./uploads:/app/uploads
      - ./log:/app/log
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.rule=Host(`${AYOCUCI_API_HOST:-api.ayocuci.id}`)"
      - "traefik.http.routers.admin-api.entrypoints=websecure"
      - "traefik.http.routers.admin-api.tls=true"
      - "traefik.http.routers.admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-network"

networks:
  ayocuci-network:
    external: true
  traefik-network:
    external: true
  mysql-database:
    name: ${MYSQL_NETWORK_NAME:-msyql-database_default}
    external: true

# Bagian volumes: ayocuci-uploads di bawah ini bisa dihapus jika tidak digunakan lagi
