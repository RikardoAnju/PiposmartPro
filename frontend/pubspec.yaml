name: piposmart_pro
description: "Piposmart Pro - Laundry Management System"

publish_to: "none"

version: 1.0.6+36

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.2
  sign_in_with_apple: ^7.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.2.1
  device_info_plus: ^13.1.0
  mobile_scanner: ^7.2.0
  screenshot: ^3.0.0
  print_bluetooth_thermal: ^1.2.2
  qr_flutter: ^4.1.0
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  package_info_plus: ^10.1.0
  excel: ^4.0.6
  printing: ^5.14.2
  font_awesome_flutter: ^11.0.0
  flutter_contacts: ^2.2.2
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  android_intent_plus: ^6.0.0
  pdf: ^3.12.0
  in_app_purchase: ^3.2.3

  firebase_core: ^4.5.0
  flutter_localizations:
    sdk: flutter
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  web_socket_channel: ^3.0.1
  app_links: ^7.0.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.13.0
  image: 4.3.0
  crop_your_image: ^2.0.0
  confetti: ^0.8.0
  audioplayers: ^6.5.0
  flutter_image_compress: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/icons/logo/logo_ayocuci_512x512.png"
  image_path_ios: "assets/icons/logo/logo_ayocuci_512x512_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo/logo_ayocuci_512x512.png"

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/
    - assets/images/
    - assets/images/layanan/
    - assets/icons/
    - assets/icons/inventory/
    - assets/icons/inventory/category_options/
    - assets/icons/home/
    - assets/icons/logo/
    - assets/icons/pengeluaran/
    - assets/icons/setting_screen/
    - assets/icons/notification/
    - assets/icons/detail_orderan/
    - assets/icons/qris/
    - assets/bank/
    - assets/E-Wallet/
    - assets/no-data/
    - assets/laporan/
    - assets/maskot/
    - assets/sounds/
    - assets/onboarding/
    - assets/onboarding/1/
    - assets/onboarding/2/
    - assets/onboarding/3/
